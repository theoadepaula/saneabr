<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a4d"/>
      <stop offset="1" stop-color="#0a2230"/>
    </linearGradient>
    <linearGradient id="gota" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f7f9"/>
      <stop offset="1" stop-color="#9fdbe3"/>
    </linearGradient>
    <clipPath id="dentro-da-gota">
      <path d="M260 92 C260 92 158 222 158 300 A102 102 0 0 0 362 300 C362 222 260 92 260 92 Z"/>
    </clipPath>
  </defs>

  <!-- hexágono (ponta para cima, proporção dos stickers de pacote) -->
  <polygon points="260,6 514,153 514,447 260,594 6,447 6,153"
           fill="url(#fundo)" stroke="#5cc3cf" stroke-width="12" stroke-linejoin="round"/>

  <!-- gota -->
  <path d="M260 92 C260 92 158 222 158 300 A102 102 0 0 0 362 300 C362 222 260 92 260 92 Z"
        fill="url(#gota)"/>

  <g clip-path="url(#dentro-da-gota)">
    <!-- água no fundo da gota -->
    <path d="M150 338 C185 324 215 324 245 338 S305 352 335 338 S370 326 380 330 L380 420 L150 420 Z"
          fill="#5cc3cf" opacity="0.55"/>
    <!-- três barras crescentes: o dado dentro do saneamento -->
    <rect x="203" y="290" width="28" height="70" fill="#123a4d"/>
    <rect x="246" y="250" width="28" height="110" fill="#123a4d"/>
    <rect x="289" y="210" width="28" height="150" fill="#123a4d"/>
    <!-- linha de base -->
    <rect x="190" y="360" width="140" height="5" fill="#123a4d"/>
  </g>

  <text x="260" y="470" text-anchor="middle"
        font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif"
        font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-1">saneabr</text>
  <text x="260" y="516" text-anchor="middle"
        font-family="'IBM Plex Mono', Consolas, monospace"
        font-size="24" fill="#9fdbe3" letter-spacing="5">SNIS · SINISA</text>
</svg>
