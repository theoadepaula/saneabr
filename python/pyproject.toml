[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saneabr"
version = "0.1.0"
description = "Acesso aos dados do SNIS e do SINISA (saneamento básico, Ministério das Cidades)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Théo de Paula", email = "theophd@gmail.com" }]
keywords = ["saneamento", "snis", "sinisa", "brasil", "residuos solidos", "dados abertos"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Natural Language :: Portuguese (Brazilian)",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=1.5",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "requests>=2.28",
  "platformdirs>=3",
]

[project.optional-dependencies]
rar = ["rarfile>=4.1"]
teste = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/theoadepaula/saneabr"
Issues = "https://github.com/theoadepaula/saneabr/issues"
Changelog = "https://github.com/theoadepaula/saneabr/blob/master/python/CHANGELOG.md"
Documentation = "https://github.com/theoadepaula/saneabr#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saneabr = ["spec/*.json", "spec/*.csv", "spec/*.md", "spec/dicionarios/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "rede: precisa de internet (pula sem SANEABR_TESTAR_REDE=1)",
  "dados: precisa dos arquivos brutos em SANEABR_DADOS_BRUTOS",
]
